<!doctype html><n<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игровая планета</title><style>
:root{--bg:#11162d;--panel:#20294c;--panel2:#303b68;--txt:#f5f6ff;--muted:#bdc6e8;--a:#a99bff;--b:#64e3c5;--pink:#ff9dce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#343e78,#11162d 55%);color:var(--txt);font:16px system-ui,Arial,sans-serif;min-height:100vh}header{text-align:center;padding:26px 15px 16px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px}header p{color:var(--muted);margin:0}.wrap{max-width:1100px;margin:auto;padding:0 16px 35px}.toolbar,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center}.toolbar{margin:15px 0 23px}button,input{font:inherit;border:0;border-radius:12px;padding:11px 14px}button{background:var(--a);color:#17152d;font-weight:750;cursor:pointer;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.35;cursor:default;transform:none}.secondary{background:var(--panel2);color:var(--txt)}.green{background:var(--b)}.pink{background:var(--pink)}input{background:#f5f6ff;color:#171a30;max-width:100%;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:linear-gradient(145deg,var(--panel),#171e3a);border:1px solid #3d4977;border-radius:20px;padding:19px;display:flex;flex-direction:column;gap:10px;min-height:180px}.emoji{font-size:2rem}.card h2{margin:0;font-size:1.15rem}.card p{margin:0;color:var(--muted);flex:1}.card button{width:100%}#play{display:none;background:rgba(32,41,76,.97);border:1px solid #465384;border-radius:22px;padding:clamp(15px,4vw,28px);margin-top:22px}#play.show{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h2{margin:0}.content{margin-top:17px}.notice{color:var(--muted);min-height:25px}.qa{background:#2a355f;padding:15px;border-radius:14px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:12px 0}.choices button{min-height:46px}.sudoku{display:grid;grid-template-columns:repeat(9,minmax(23px,1fr));max-width:450px;margin:14px auto;border:2px solid white}.sudoku input{width:100%;height:38px;padding:0;text-align:center;border-radius:0;border:1px solid #7782a8;background:#f6f7ff;color:#20294c}.sudoku input.given{background:#d9def8;font-weight:900}.sudoku input:nth-child(3n){border-right:2px solid #303b68}.sudoku input:nth-child(n+19):nth-child(-n+27),.sudoku input:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #303b68}.letters{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.letter{background:#303b68;min-width:37px;text-align:center;padding:11px 7px;border-radius:8px;font-weight:800}.hidden{color:transparent}.memory{display:grid;grid-template-columns:repeat(4,minmax(50px,1fr));gap:9px;max-width:430px}.memory button{height:68px;font-size:1.4rem;background:#303b68;color:white}.memory button.matched{background:#28695f}.ladder{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.ladder span{background:#303b68;border-radius:8px;padding:6px 9px}.ladder .current{background:var(--b);color:#14223a;font-weight:900}.notice{margin:12px 0}footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}@media(max-width:480px){.sudoku input{height:31px}.letter{min-width:29px;padding:9px 5px}}
</style></head><body><header><h1>🎮 Игровая планета</h1><p>Семь игр в одном месте — выбирай и играй!</p></header><main class="wrap"><div class="toolbar"><button id="sound" class="secondary" onclick="toggleSound()">🔊 Озвучка: включена</button><button class="secondary" onclick="speak('Добро пожаловать на Игровую планету! Выбери игру и нажми на кнопку.')">🗣️ Приветствие</button></div><section id="games" class="grid"></section><section id="play"><div class="head"><h2 id="title">Игра</h2><button class="secondary" onclick="closeGame()">← К списку игр</button></div><div id="content" class="content"></div></section></main><footer>Игровая планета · Озвучка использует голос браузера. Если русский голос недоступен, он может звучать иначе.</footer>
<script>
let soundOn=true;function speak(t){if(!soundOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(t));u.lang='ru-RU';u.rate=.96;speechSynthesis.speak(u)}function toggleSound(){soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Озвучка: включена':'🔇 Озвучка: выключена';if(!soundOn&&'speechSynthesis'in window)speechSynthesis.cancel();else speak('Озвучка включена')}document.addEventListener('click',e=>{let b=e.target.closest('button');if(b&&b.id!=='sound'&&!b.disabled)speak(b.innerText)});
const data=[['sudoku','🔢','Судоку','Заполни сетку цифрами от 1 до 9.'],['guess','🎯','Угадай число','Найди загаданное число от 1 до 100.'],['wheel','🎡','Поле чудес','Угадывай буквы и открой слово.'],['quiz','🧠','Викторина','Проверь свои знания.'],['memory','🧩','Найди совпадения','Найди все одинаковые пары карточек.'],['million','💰','Кто хочет стать миллионером','Отвечай и поднимайся по уровням.'],['jeopardy','⭐','Своя игра','Выбирай тему и стоимость вопроса.']];document.getElementById('games').innerHTML=data.map(g=>`<article class="card"><div class="emoji">${g[1]}</div><h2>${g[2]}</h2><p>${g[3]}</p><button onclick="startGame('${g[0]}')">Играть</button></article>`).join('');function closeGame(){document.getElementById('play').classList.remove('show');document.getElementById('games').style.display='grid'}function show(title,html){document.getElementById('title').textContent=title;document.getElementById('content').innerHTML=html;document.getElementById('play').classList.add('show');document.getElementById('games').style.display='none';document.getElementById('play').scrollIntoView({behavior:'smooth'});speak(title+' началась')}function startGame(id){({sudoku:makeSudoku,guess:makeGuess,wheel:makeWheel,quiz:makeQuiz,memory:makeMemory,million:makeMillion,jeopardy:makeJeopardy})[id]()}
function makeGuess(){window.gn=Math.floor(Math.random()*100)+1;window.gt=0;show('🎯 Угадай число',`<p>Я загадала число от 1 до 100. Попробуй угадать!</p><div class="row"><input id="gi" type="number" min="1" max="100" placeholder="Твоё число"><button onclick="checkGuess()">Проверить</button><button class="secondary" onclick="makeGuess()">Заново</button></div><p id="gm" class="notice">Попыток: 0</p>`)}function checkGuess(){let v=+document.getElementById('gi').value,m=document.getElementById('gm');if(!v||v<1||v>100){m.textContent='Введи число от 1 до 100.';speak(m.textContent);return}window.gt++;m.textContent=v===window.gn?`Верно! Это ${window.gn}. Попыток: ${window.gt}.`:(v<window.gn?'Моё число больше.':'Моё число меньше.')+` Попыток: ${window.gt}.`;speak(m.textContent)}
const words=[['КОСМОС','Пространство за пределами Земли'],['РОМАШКА','Цветок с белыми лепестками'],['ПИРАТ','Морской искатель сокровищ'],['ПЛАНЕТА','Небесное тело вокруг звезды'],['КНИГА','Её читают']];function makeWheel(){let x=words[Math.floor(Math.random()*words.length)];window.ww=x[0];window.wg=[];window.we=0;renderWheel(x[1])}function renderWheel(h){show('🎡 Поле чудес',`<p>Подсказка: <b>${h}</b></p><div class="letters">${[...ww].map(c=>`<span class="letter ${wg.includes(c)?'':'hidden'}">${c}</span>`).join('')}</div><p class="notice" id="wm">Ошибок: ${we}/6</p><div class="row"><input id="wi" maxlength="1" placeholder="Буква"><button onclick="guessLetter()">Назвать букву</button><button class="secondary" onclick="makeWheel()">Новое слово</button></div>`)}function guessLetter(){let v=document.getElementById('wi').value.trim().toUpperCase();if(!v)return;if(!wg.includes(v)){wg.push(v);if(!ww.includes(v))we++}let won=[...ww].every(c=>wg.includes(c)),lost=we>=6,h=words.find(x=>x[0]===ww)[1];renderWheel(h);if(won||lost){document.getElementById('wm').textContent=won?'Победа! Слово: '+ww:'Попытки закончились. Слово: '+ww;speak(document.getElementById('wm').textContent)}}
const qq=[['Сколько будет 7 × 8?',['54','56','64','48'],1],['Какая планета известна как Красная?',['Венера','Марс','Юпитер','Сатурн'],1],['Столица Японии?',['Пекин','Сеул','Токио','Бангкок'],2],['Какой океан самый большой?',['Атлантический','Индийский','Северный Ледовитый','Тихий'],3],['Сколько сторон у шестиугольника?',['5','6','7','8'],1],['Кто написал «Маленького принца»?',['Экзюпери','Жюль Верн','Марк Твен','Астрид Линдгрен'],0]];function makeQuiz(){window.qi=0;window.qs=0;showQuiz()}function showQuiz(){if(qi>=qq.length){show('🧠 Викторина',`<h3>Результат: ${qs} из ${qq.length}</h3><button onclick="makeQuiz()">Пройти ещё раз</button>`);return}let q=qq[qi];show('🧠 Викторина',`<p>Вопрос ${qi+1} из ${qq.length} · Очки: ${qs}</p><div class="qa"><h3>${q[0]}</h3><div class="choices">${q[1].map((a,j)=>`<button class="secondary" onclick="answerQuiz(${j})">${a}</button>`).join('')}</div></div><p id="qm" class="notice"></p>`)}function answerQuiz(j){let q=qq[qi],ok=j===q[2];if(ok)qs++;document.getElementById('qm').textContent=ok?'Верно!':'Правильный ответ: '+q[1][q[2]];speak(document.getElementById('qm').textContent);qi++;setTimeout(showQuiz,900)}
function makeMemory(){let vals=['🍓','🌙','🐱','🌷','⭐','🍀','🎈','🦋'];window.md=[...vals,...vals].sort(()=>Math.random()-.5);window.mo=[];window.mm=[];window.ml=false;showMemory()}function showMemory(){show('🧩 Найди совпадения',`<p>Найди все одинаковые пары.</p><div class="memory">${md.map((v,i)=>`<button class="${mm.includes(i)?'matched':''}" onclick="flipMemory(${i})">${mm.includes(i)||mo.includes(i)?v:'?'}</button>`).join('')}</div><p class="notice">Найдено пар: ${mm.length/2} из 8</p><button class="secondary" onclick="makeMemory()">Перемешать</button>`)}function flipMemory(i){if(ml||mm.includes(i)||mo.includes(i))return;mo.push(i);if(mo.length===2){if(md[mo[0]]===md[mo[1]]){mm.push(...mo);mo=[];showMemory();if(mm.length===md.length)speak('Отлично! Все пары найдены!')}else{ml=true;showMemory();setTimeout(()=>{mo=[];ml=false;showMemory()},750)}}else showMemory()}
const mqs=[['Какой цвет получится при смешении синего и жёлтого?',['Зелёный','Красный','Фиолетовый','Оранжевый'],0],['Сколько минут в одном часе?',['30','60','90','100'],1],['Какое животное называют царём зверей?',['Тигр','Лев','Слон','Волк'],1],['Какой газ нужен людям для дыхания?',['Гелий','Азот','Кислород','Водород'],2],['Сколько континентов выделяют в распространённой школьной модели?',['5','6','7','8'],2],['Как называется прибор для измерения температуры?',['Барометр','Термометр','Компас','Линейка'],1],['Какой металл обозначают символом Fe?',['Медь','Железо','Серебро','Золото'],1],['Кто написал «Евгения Онегина»?',['Лермонтов','Толстой','Пушкин','Гоголь'],2],['Какая планета ближе всего к Солнцу?',['Венера','Земля','Меркурий','Марс'],2],['Сколько градусов в прямом угле?',['45','90','120','180'],1]];const prizes=['1 000','5 000','10 000','25 000','50 000','100 000','250 000','500 000','750 000','1 000 000'];function makeMillion(){window.mi=0;showMillion()}function showMillion(){if(mi>=mqs.length){show('💰 Миллионер',`<h3>Поздравляем! Ты выиграла 1 000 000 виртуальных очков!</h3><button onclick="makeMillion()">Играть снова</button>`);return}let q=mqs[mi];show('💰 Кто хочет стать миллионером',`<p>Вопрос ${mi+1} из 10</p><div class="ladder">${prizes.map((p,j)=>`<span class="${j===mi?'current':''}">${p}</span>`).join('')}</div><div class="qa"><h3>${q[0]}</h3><div class="choices">${q[1].map((a,j)=>`<button class="secondary" onclick="answerMillion(${j})">${String.fromCharCode(65+j)}: ${a}</button>`).join('')}</div></div><button class="pink" onclick="makeMillion()">Начать заново</button>`)}function answerMillion(j){let q=mqs[mi];if(j===q[2]){mi++;speak('Правильно!');setTimeout(showMillion,450)}else{show('💰 Миллионер',`<h3>Игра окончена!</h3><p>Правильный ответ: ${q[1][q[2]]}.</p><p>Пройдено вопросов: ${mi} из 10.</p><button onclick="makeMillion()">Попробовать снова</button>`);speak('Игра окончена. Попробуй ещё раз!')}}
const cats=[{name:'Наука',qs:[['Как называется центр атома?','Ядро',100],['Какая планета самая большая?','Юпитер',200],['Как называется превращение воды в пар?','Испарение',300]]},{name:'География',qs:[['Столица Франции?','Париж',100],['Какую реку часто называют самой длинной в мире?','Нил',200],['На каком материке находится Сахара?','Африка',300]]},{name:'Литература',qs:[['Кто написал «Капитанскую дочку»?','Пушкин',100],['Как зовут героиню сказки Льюиса Кэрролла?','Алиса',200],['Кто написал «Ромео и Джульетту»?','Шекспир',300]]}];function makeJeopardy(){window.ju=[];window.js=0;showJeopardy()}function showJeopardy(){show('⭐ Своя игра',`<p>Очки: <b>${js}</b>. Выбирай категорию и стоимость.</p><div style="display:grid;grid-template-columns:repeat(3,minmax(85px,1fr));gap:8px">${cats.map((c,ci)=>`<div><b>${c.name}</b>${c.qs.map((q,qi)=>`<button style="display:block;width:100%;margin-top:7px" ${ju.includes(ci+'-'+qi)?'disabled':''} onclick="askJ(${ci},${qi})">${q[2]}</button>`).join('')}</div>`).join('')}</div><p class="notice">Выбирай вопрос!</p><button class="secondary" onclick="makeJeopardy()">Новая игра</button>`)}function askJ(ci,qi){let q=cats[ci].qs[qi];window.jkey=ci+'-'+qi;ju.push(jkey);document.getElementById('content').innerHTML=`<p>${cats[ci].name} · ${q[2]} очков</p><div class="qa"><h3>${q[0]}</h3><div class="row"><input id="ja" placeholder="Твой ответ"><button onclick="checkJ(${ci},${qi})">Ответить</button></div></div><p id="jm" class="notice"></p><button class="secondary" onclick="showJeopardy()">Назад к полю</button>`;speak(q[0])}function checkJ(ci,qi){let q=cats[ci].qs[qi],v=document.getElementById('ja').value.trim().toLowerCase(),a=q[1].toLowerCase(),ok=v===a||(a.startsWith(v)&&v.length>=4);if(ok)js+=q[2];document.getElementById('jm').textContent=ok?'Верно! +'+q[2]+' очков.':'Ответ: '+q[1]+'.';speak(document.getElementById('jm').textContent)}
function makeSudoku(){window.sp=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];showSudoku()}function showSudoku(){show('🔢 Судоку',`<p>Заполни пустые клетки цифрами 1–9. В каждой строке, колонке и квадрате 3×3 цифры не повторяются.</p><div class="sudoku">${sp.flat().map((v,i)=>`<input id="s${i}" type="number" min="1" max="9" value="${v||''}" ${v?'readonly class="given"':''} aria-label="Клетка ${i+1}">`).join('')}</div><div class="row"><button onclick="checkSudoku()">Проверить</button><button class="secondary" onclick="makeSudoku()">Сбросить</button></div><p id="sm" class="notice"></p>`)}function checkSudoku(){let v=sp.map((r,ri)=>r.map((n,ci)=>n||Number(document.getElementById('s'+(ri*9+ci)).value)),ok=true,complete=v.every(r=>r.every(n=>n>=1&&n<=9));if(!complete){document.getElementById('sm').textContent='Заполни все клетки.';speak('Заполни все клетки.');return}for(let i=0;i<9;i++){if(new Set(v[i]).size!==9||new Set(v.map(r=>r[i])).size!==9)ok=false}for(let br=0;br<9;br+=3)for(let bc=0;bc<9;bc+=3){let a=[];for(let r=br;r<br+3;r++)for(let c=bc;c<bc+3;c++)a.push(v[r][c]);if(new Set(a).size!==9)ok=false}document.getElementById('sm').textContent=ok?'Отлично! Судоку решено правильно.':'Есть повторы в строках, столбцах или квадратах.';speak(document.getElementById('sm').textContent)}
</script></body></html>
